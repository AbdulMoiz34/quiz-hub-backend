name: Backend checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Syntax checks
        run: npm run check
      - name: Tests
        run: npm test
      - name: Local transport-only smoke (no database)
        run: node src/scripts/testExamJourney.js --users=5 --transport-only

  integration:
    name: Real MongoDB student/admin journeys
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping:1}).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
    env:
      # Fresh, local and disposable MongoDB database; no production credentials.
      TEST_MONGODB_URI: mongodb://127.0.0.1:27017/quiz_hub_test
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: PM2 starts the real HTTP server
        env:
          MONGODB_URI: mongodb://127.0.0.1:27017/quiz_hub_test
          JWT_SECRET: ci-only-local-startup-test-secret-at-least-32-chars
          CORS_ORIGINS: http://localhost:5173
        run: |
          npm install -g pm2 --no-audit --no-fund
          pm2 start src/server.js --name quiz-hub-smoke
          trap 'pm2 delete quiz-hub-smoke >/dev/null 2>&1 || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:5000/api/v1/ready; then
              echo "PM2 startup verified"
              exit 0
            fi
            sleep 1
          done
          pm2 logs quiz-hub-smoke --lines 30 --nostream
          exit 1
      - name: Check basic HTTP + MongoDB journey
        run: npm run test:db
      - name: Check concurrent drafts, submissions, expiry and restart
        run: npm run test:races
      - name: Check full admin/student lifecycle, violations, grading and reattempt
        run: npm run test:journey
      - name: Check 200 simultaneous student journeys
        run: node src/scripts/testExamJourney.js --users=200
      - name: Check 250 simultaneous student journeys
        run: node src/scripts/testExamJourney.js --users=250
      - name: Check 300 simultaneous student journeys
        run: node src/scripts/testExamJourney.js --users=300
